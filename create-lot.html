<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Создать лот - MotoAuction</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https:cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-theme">
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <a href="index.html" class="logo">
                    <i class="fas fa-motorcycle"></i>
                    <span>Moto</span>Auction
                </a>
                
                <div class="nav-links">
                    <a href="index.html"><i class="fas fa-home"></i> Главная</a>
                    <a href="dashboard.html"><i class="fas fa-user"></i> Личный кабинет</a>
                </div>
                
                <div class="nav-auth" id="auth-buttons"></div>
                
                <button class="theme-toggle" id="theme-toggle">
                    <i class="fas fa-moon"></i>
                </button>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="form-container" style="max-width: 800px;">
            <h2 class="form-title">Выставить мотоцикл на аукцион</h2>
            
            <form onsubmit="createLot(event)" id="create-lot-form">
                <div class="form-group">
                    <label class="form-label">Название лота</label>
                    <input type="text" class="form-input" id="title" required placeholder="Например: Harley-Davidson Sportster 1200">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Марка</label>
                        <select class="form-input" id="brand" required>
                            <option value="">Выберите марку</option>
                            <option value="Harley-Davidson">Harley-Davidson</option>
                            <option value="Yamaha">Yamaha</option>
                            <option value="Honda">Honda</option>
                            <option value="Suzuki">Suzuki</option>
                            <option value="Kawasaki">Kawasaki</option>
                            <option value="BMW">BMW</option>
                            <option value="Ducati">Ducati</option>
                            <option value="Triumph">Triumph</option>
                            <option value="KTM">KTM</option>
                            <option value="Aprilia">Aprilia</option>
                            <option value="Other">Другая</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Модель</label>
                        <input type="text" class="form-input" id="model" required placeholder="Модель мотоцикла">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Год выпуска</label>
                        <input type="number" class="form-input" id="year" required min="1950" max="2025" placeholder="Год">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Начальная цена (₽)</label>
                        <input type="number" class="form-input" id="price" required min="1000" step="1000" placeholder="Начальная цена">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Описание</label>
                    <textarea class="form-input form-textarea" id="description" required rows="4" placeholder="Подробное описание мотоцикла: состояние, пробег, дополнительные аксессуары, история владения..."></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Фотографии мотоцикла</label>
                    <div class="image-upload-area" id="image-upload-area">
                        <div class="upload-zone" id="upload-zone">
                            <div class="upload-icon">
                                <i class="fas fa-cloud-upload-alt"></i>
                            </div>
                            <div class="upload-text">
                                <p>Перетащите фотографии сюда или</p>
                                <label class="upload-btn-label">
                                    <i class="fas fa-paperclip"></i> выберите файлы
                                    <input type="file" id="image-input" accept="image/*" multiple style="display: none;">
                                </label>
                            </div>
                            <p class="upload-hint">Поддерживаются JPG, PNG, GIF. Максимум 10 фото.</p>
                        </div>
                        
                        <div class="image-preview-grid" id="image-preview-grid">
                        </div>
                    </div>
                    <input type="hidden" id="images-data" value="">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Продолжительность аукциона</label>
                    <select class="form-input" id="duration">
                        <option value="3">3 дня</option>
                        <option value="7" selected>7 дней</option>
                        <option value="14">14 дней</option>
                        <option value="30">30 дней</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-gold" style="width: 100%;">
                    <i class="fas fa-gavel"></i> Создать лот
                </button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <a href="index.html" class="logo">
                        <i class="fas fa-motorcycle"></i>
                        <span>Moto</span>Auction
                    </a>
                    <p>Выставьте свой мотоцикл на аукцион</p>
                </div>
                <div class="footer-links">
                    <a href="index.html">На главную</a>
                    <a href="dashboard.html">Личный кабинет</a>
                    <a href="#">Помощь</a>
                </div>
            </div>
            <p class="footer-copyright">© 2024 MotoAuction. Создание лота</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        let uploadedImages = [];
        let currentImageId = 0;
        
        document.addEventListener('DOMContentLoaded', function() {
            if (!ui.auth.isLoggedIn()) {
                alert('Для создания лота необходимо войти в систему');
                window.location.href = 'login.html';
            }
            ui.initTheme();
            ui.updateAuthButtons();
            initImageUpload();
        });
        
        function initImageUpload() {
            const uploadZone = document.getElementById('upload-zone');
            const imageInput = document.getElementById('image-input');
            const previewGrid = document.getElementById('image-preview-grid');
            
            uploadZone.addEventListener('click', (e) => {
                if (e.target.closest('.upload-btn-label')) return;
                imageInput.click();
            });
            
            imageInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
                imageInput.value = '';
            });
            
            uploadZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadZone.classList.add('drag-over');
            });
            
            uploadZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                uploadZone.classList.remove('drag-over');
            });
            
            uploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadZone.classList.remove('drag-over');
                const files = e.dataTransfer.files;
                handleFiles(files);
            });
        }
        
        function handleFiles(files) {
            const imageFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
            
            if (uploadedImages.length + imageFiles.length > 10) {
                alert('Максимум 10 фотографий');
                return;
            }
            
            imageFiles.forEach(file => {
                if (file.size > 5 * 1024 * 1024) {
                    alert(`Файл ${file.name} слишком большой. Максимальный размер 5MB`);
                    return;
                }
                
                const reader = new FileReader();
                const imageId = currentImageId++;
                
                reader.onload = function(e) {
                    const imageData = {
                        id: imageId,
                        src: e.target.result,
                        file: file,
                        name: file.name
                    };
                    uploadedImages.push(imageData);
                    addImagePreview(imageData);
                    updateImagesData();
                };
                
                reader.readAsDataURL(file);
            });
        }
        
        function addImagePreview(image) {
            const previewGrid = document.getElementById('image-preview-grid');
            
            const previewItem = document.createElement('div');
            previewItem.className = 'image-preview-item';
            previewItem.dataset.id = image.id;
            
            previewItem.innerHTML = `
                <img src="${image.src}" alt="${image.name}">
                <div class="image-preview-overlay">
                    <button type="button" class="remove-image-btn" onclick="removeImage(${image.id})">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
                <div class="image-preview-order">
                    <span class="order-number">${uploadedImages.length}</span>
                    <i class="fas fa-grip-vertical"></i>
                </div>
            `;
            
            previewGrid.appendChild(previewItem);
            
            setTimeout(() => {
                previewItem.style.opacity = '1';
                previewItem.style.transform = 'scale(1)';
            }, 10);
        }
        
        function removeImage(imageId) {
            const index = uploadedImages.findIndex(img => img.id === imageId);
            if (index !== -1) {
                uploadedImages.splice(index, 1);
                
                const previewItems = document.querySelectorAll('.image-preview-item');
                const itemsToRemove = Array.from(previewItems).filter(item => 
                    parseInt(item.dataset.id) === imageId
                );
                itemsToRemove.forEach(item => item.remove());
                
                const remainingItems = document.querySelectorAll('.image-preview-item');
                remainingItems.forEach((item, idx) => {
                    const orderSpan = item.querySelector('.order-number');
                    if (orderSpan) {
                        orderSpan.textContent = idx + 1;
                    }
                });
                
                updateImagesData();
            }
        }
        
        function updateImagesData() {
            const imagesDataInput = document.getElementById('images-data');
            const imagesArray = uploadedImages.map(img => img.src);
            imagesDataInput.value = JSON.stringify(imagesArray);
        }
        
        function createLot(event) {
            event.preventDefault();
            
            const title = document.getElementById('title').value;
            const brand = document.getElementById('brand').value;
            const model = document.getElementById('model').value;
            const year = parseInt(document.getElementById('year').value);
            const startingPrice = parseInt(document.getElementById('price').value);
            const description = document.getElementById('description').value;
            const duration = parseInt(document.getElementById('duration').value);
            
            const imagesData = document.getElementById('images-data').value;
            const images = imagesData ? JSON.parse(imagesData) : [];
            
            if (images.length === 0) {
                alert('Пожалуйста, добавьте хотя бы одну фотографию мотоцикла');
                return;
            }
            
            const mainImage = images[0];
            const allImages = images;
            
            const endDate = new Date();
            endDate.setDate(endDate.getDate() + duration);
            
            const motorcycleData = {
                title,
                brand,
                model,
                year,
                startingPrice,
                description,
                image: mainImage,
                images: allImages,
                endDate: endDate.toISOString()
            };
            
            const result = ui.auctionSystem.createAuction(motorcycleData);
            
            if (result.success) {
                alert('✅ Лот создан! Ожидайте подтверждения администратора.');
                window.location.href = 'dashboard.html';
            } else {
                alert('❌ Ошибка: ' + result.message);
            }
        }
    </script>
    
    <style>
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
        
        .image-upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            background-color: var(--bg-secondary);
            transition: all 0.3s ease;
        }
        
        .upload-zone {
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-zone.drag-over {
            border-color: var(--gold);
            background-color: rgba(212, 175, 55, 0.1);
        }
        
        .upload-icon {
            font-size: 48px;
            color: var(--gold);
            margin-bottom: 15px;
        }
        
        .upload-text p {
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        
        .upload-btn-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--gold);
            color: #000;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .upload-btn-label:hover {
            background-color: var(--gold-dark);
            transform: translateY(-2px);
        }
        
        .upload-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 15px;
        }
        
        .image-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            padding: 20px;
            border-top: 1px solid var(--border);
            max-height: 400px;
            overflow-y: auto;
        }
        
        .image-preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--bg-primary);
            border: 2px solid var(--border);
            transition: all 0.3s ease;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        
        .image-preview-item:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
        }
        
        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .image-preview-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .image-preview-item:hover .image-preview-overlay {
            opacity: 1;
        }
        
        .remove-image-btn {
            background-color: var(--danger);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .remove-image-btn:hover {
            background-color: #c82333;
            transform: scale(1.1);
        }
        
        .image-preview-order {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: rgba(0, 0, 0, 0.7);
            color: var(--gold);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: move;
        }
        
        .image-preview-order i {
            font-size: 10px;
            opacity: 0.7;
        }
        
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }
        
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        .lightbox-prev,
        .lightbox-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s;
        }
        
        .lightbox-prev {
            left: 20px;
        }
        
        .lightbox-next {
            right: 20px;
        }
        
        .lightbox-prev:hover,
        .lightbox-next:hover {
            background-color: rgba(212, 175, 55, 0.8);
        }
        
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .image-preview-item {
            animation: fadeInScale 0.2s ease forwards;
        }
        
        .upload-zone.drag-over .upload-icon i {
            transform: translateY(-5px);
        }
        
        .upload-zone.drag-over .upload-icon i {
            animation: bounce 0.5s ease;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</body>
</html>
